[package]
name = "webcodex-workspace"
version.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
workspace-checkpoints = []

[dependencies]
webcodex-core = { path = "../webcodex-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
